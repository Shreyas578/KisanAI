name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set environment URL
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
            echo "deploy_url=staging.kisanai.com" >> $GITHUB_OUTPUT
            echo "deploy_key=${{ secrets.STAGING_DEPLOY_KEY }}" >> $GITHUB_OUTPUT
            echo "deploy_host=${{ secrets.STAGING_DEPLOY_HOST }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_url=api.kisanai.com" >> $GITHUB_OUTPUT
            echo "deploy_key=${{ secrets.PROD_DEPLOY_KEY }}" >> $GITHUB_OUTPUT
            echo "deploy_host=${{ secrets.PROD_DEPLOY_HOST }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ steps.env.outputs.deploy_key }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.env.outputs.deploy_host }} >> ~/.ssh/known_hosts 2>/dev/null || true
      
      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            deploy@${{ steps.env.outputs.deploy_host }} \
            "cd /var/www/kisan-api && \
             git pull origin main && \
             npm ci --only=production && \
             npm run migrate && \
             pm2 restart kisan-api || pm2 start ecosystem.config.js"
      
      - name: Verify deployment
        run: |
          curl -f https://${{ steps.env.outputs.deploy_url }}/health || exit 1
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Backend deployment to ${{ github.event.inputs.environment || 'production' }} ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend Deployment* - ${{ job.status }}\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\nURL: https://${{ steps.env.outputs.deploy_url }}/health"
                  }
                }
              ]
            }

  deploy-mobile:
    name: Deploy Mobile Apps
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
      
      - name: Setup Java for Android
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Get dependencies
        run: cd mobile/kisan_ai && flutter pub get
      
      - name: Build Android Release
        run: cd mobile/kisan_ai && flutter build appbundle --release
      
      - name: Build iOS Release
        run: cd mobile/kisan_ai && flutter build ios --release
      
      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.kisan.ai
          releaseFiles: mobile/kisan_ai/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.environment == 'staging' && 'internal' || 'production' }}
          status: completed
      
      - name: Upload to App Store
        uses: apple-actions/upload-testflight-build@v1
        if: github.event.inputs.environment != 'staging'
        with:
          app-path: mobile/kisan_ai/build/ios/iphoneos/Runner.app
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_KEY_PRIVATE }}
      
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "Mobile deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Mobile Deployment* - ${{ job.status }}\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\nVersion: ${{ github.ref }}"
                  }
                }
              ]
            }

  post-deploy-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-mobile]
    if: always()
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set environment URL
        id: env
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "staging" ]]; then
            echo "api_url=https://staging.kisanai.com" >> $GITHUB_OUTPUT
          else
            echo "api_url=https://api.kisanai.com" >> $GITHUB_OUTPUT
          fi
      
      - name: Health Check
        run: |
          curl -f ${{ steps.env.outputs.api_url }}/health
          curl -f ${{ steps.env.outputs.api_url }}/api/auth/login -X OPTIONS
      
      - name: Run Smoke Tests
        run: |
          echo "Testing critical endpoints..."
          
          # Test disease detection
          curl -f ${{ steps.env.outputs.api_url }}/api/disease/detect -X OPTIONS
          
          # Test market prices
          curl -f ${{ steps.env.outputs.api_url }}/api/price/commodity -X OPTIONS
          
          # Test chatbot
          curl -f ${{ steps.env.outputs.api_url }}/api/chatbot/message -X OPTIONS
          
          # Test marketplace
          curl -f ${{ steps.env.outputs.api_url }}/api/marketplace/listings -X OPTIONS
          
          echo "✅ All endpoints responding"
      
      - name: Notify Slack - Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Deployment Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Complete* ✅\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\nAll tests passed!\n\n_Check the deployment logs for details._"
                  }
                }
              ]
            }
      
      - name: Notify Slack - Failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* ❌\nEnvironment: ${{ github.event.inputs.environment || 'production' }}\n\n_Check the logs immediately for rollback procedures._"
                  }
                }
              ]
            }
