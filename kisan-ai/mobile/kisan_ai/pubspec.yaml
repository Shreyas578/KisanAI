name: kisan_ai
description: "Kisan AI - Your field. Your data. Your power."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0
  hive_flutter: ^1.1.0
  dio: ^5.4.3
  dio_cache_interceptor: ^3.5.0
  connectivity_plus: ^6.0.3
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^9.1.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  image: ^4.0.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  gap: ^3.0.1
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  shared_preferences: ^2.3.1
  path_provider: ^2.1.4
  crypto: ^3.0.3
  http: ^1.1.0
  json_annotation: ^4.9.0
  intl: ^0.19.0
  just_audio: ^0.9.38
  share_plus: ^7.2.0
  flutter_typeahead: ^4.8.0
  tflite_flutter: 0.10.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/lottie/
    - assets/offline_models/
    - assets/i18n/
    - assets/models/crop_disease_model.tflite
    - assets/models/disease_labels.json
